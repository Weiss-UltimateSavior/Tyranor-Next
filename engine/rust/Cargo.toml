[package]
name = "archive_xp3-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
tokio = { version = "1", features = ["io-util"] }
xp3 = "0.4"
flate2 = "1"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
# NOTE: no `panic = "abort"` — the JNI `guarded`/`catch_unwind` crash guards
# depend on unwinding; abort would turn every Rust panic into a process death.
