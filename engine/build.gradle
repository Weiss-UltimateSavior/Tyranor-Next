plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.core.engine'
    compileSdk 36
    ndkVersion '28.0.13004108'

    defaultConfig {
        minSdk 26
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters 'arm64-v8a'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding false
    }

    testOptions {
        unitTests {
            // 纯 JVM 单测不该被 android.util.Log 的「not mocked」阻断：
            // 失败/边界分支里的日志会抛 RuntimeException，掩盖真正的断言。
            returnDefaultValues = true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.androidx.documentfile
    implementation libs.kotlin.stdlib
    testImplementation libs.junit
    // 覆盖 android.jar 的 org.json stub（纯 JVM 单测需要真实现）：
    // - input 配置模型的解析测试；
    // - RpgMakerFsBridge 的 readdir/stat 以 JSON 字符串交付结果，stub 下构造函数
    //   不初始化内部字段会抛 NPE，纯 JVM 单测无法覆盖这两条路径
    // （与 app 模块 GameOverridePartitionsTest 同一约定）
    testImplementation libs.json
}

/**
 * v2 兼容层的 JS 端到端检查（engine/src/test/js/v2-fs-bridge.harness.js）。
 *
 * 该 harness 用 Node 仿真 WebView，跑真实注入链路（基础层 + v2 层 + 桥仿真），
 * 覆盖 fs/crypto/zlib/Buffer/localStorage 等行为并与 Node 真值逐项对照。
 * 接入 check 生命周期，避免它随代码演进而静默失效。
 *
 * 通过 -PskipJsHarness 可跳过（例如本机无 Node 的纯 Android 构建环境）。
 */
def skipJsHarness = providers.gradleProperty('skipJsHarness').isPresent()

tasks.register('jsHarness', RunJsHarness) {
    description = 'Runs the v2 compatibility-layer JS harness (requires Node.js).'
    group = 'verification'
    scriptFile.set(layout.projectDirectory.file('src/test/js/v2-fs-bridge.harness.js'))
    // 只有在显式传 -PskipJsHarness 时才跳过；其余情况一律执行
    onlyIf { !skipJsHarness }
}

tasks.named('check') {
    dependsOn 'jsHarness'
}

// Each filter family owns its registration and assets; no optional filter IDs in shared code.
def graphicsCatalog = tasks.register('generateGraphicsFilters', GenerateGraphicsFilters) {
    descriptors.set(layout.projectDirectory.dir('src/main/graphicsfilters'))
    assetsDirectory.set(layout.projectDirectory.dir('src/main/assets'))
    outputDirectory.set(layout.buildDirectory.dir('generated/graphicsFilters'))
}
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.java.addGeneratedSourceDirectory(graphicsCatalog) { it.outputDirectory }
    }
}

// Provenance follows the descriptors: absent optional contributions have no required hashes.
def verifyGraphicsResources = tasks.register('verifyGraphicsResources', VerifyGraphicsResources) {
    group = 'verification'
    description = 'Verifies pinned local graphics assets, licenses and the unmodified bundled runtime.'
    manifestsDirectory.set(layout.projectDirectory.dir('patches'))
    descriptorsDirectory.set(layout.projectDirectory.dir('src/main/graphicsfilters'))
    engineDirectory.set(layout.projectDirectory)
    artifacts.from(fileTree('src/main/assets') { include '**/*.glsl', '**/LICENSE*' })
    artifacts.from(fileTree('patches') { include '**/*.patch', '**/previous-exports.txt' })
    artifacts.from(file('src/main/jniLibs/arm64-v8a/libsiglus.so'))
}
tasks.named('preBuild') { dependsOn verifyGraphicsResources }
tasks.named('check') { dependsOn verifyGraphicsResources }

tasks.register('dkToolsHarness', RunJsHarness) {
    description = 'Verifies browser DKTools filesystem-index compatibility.'
    group = 'verification'
    scriptFile.set(layout.projectDirectory.file('src/test/js/dktools-compat.harness.js'))
    onlyIf { !skipJsHarness }
}

tasks.named('check') { dependsOn 'dkToolsHarness' }
