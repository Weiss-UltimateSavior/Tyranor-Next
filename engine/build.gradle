plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.core.engine'
    compileSdk 36
    ndkVersion '28.0.13004108'

    defaultConfig {
        minSdk 26
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters 'arm64-v8a'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding false
    }

    testOptions {
        unitTests {
            // 纯 JVM 单测不该被 android.util.Log 的「not mocked」阻断：
            // 失败/边界分支里的日志会抛 RuntimeException，掩盖真正的断言。
            returnDefaultValues = true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.androidx.documentfile
    implementation libs.kotlin.stdlib
    testImplementation libs.junit
    // 覆盖 android.jar 的 org.json stub：RpgMakerFsBridge 的 readdir/stat 以 JSON 字符串
    // 交付结果，stub 下构造函数不初始化内部字段会抛 NPE，纯 JVM 单测无法覆盖这两条路径
    // （与 app 模块 GameOverridePartitionsTest 同一约定）
    testImplementation libs.json
}

/**
 * v2 兼容层的 JS 端到端检查（engine/src/test/js/v2-fs-bridge.harness.js）。
 *
 * 该 harness 用 Node 仿真 WebView，跑真实注入链路（基础层 + v2 层 + 桥仿真），
 * 覆盖 fs/crypto/zlib/Buffer/localStorage 等行为并与 Node 真值逐项对照。
 * 接入 check 生命周期，避免它随代码演进而静默失效。
 *
 * 通过 -PskipJsHarness 可跳过（例如本机无 Node 的纯 Android 构建环境）。
 */
def skipJsHarness = providers.gradleProperty('skipJsHarness').isPresent()

tasks.register('jsHarness', Exec) {
    description = 'Runs the v2 compatibility-layer JS harness (requires Node.js).'
    group = 'verification'
    workingDir = layout.projectDirectory.dir('src/test/js')
    commandLine 'node', 'v2-fs-bridge.harness.js'
    // 只有在显式传 -PskipJsHarness 时才跳过；其余情况一律执行
    onlyIf { !skipJsHarness }
    // 无 Node 时 Exec 默认只报「系统找不到指定的文件」，看不出是缺依赖还是脚本挂了。
    // 这里改用「忽略退出码 + 事后检查」，避免在 doFirst 里 exec（配置缓存下不可用）。
    ignoreExitValue = true
    doLast {
        if (executionResult.get().exitValue != 0) {
            def detail = executionResult.get().failure?.message ?: '未知错误'
            throw new GradleException(
                'jsHarness 执行失败（需要 Node.js）。' +
                ' 若因缺少 node：安装 Node 后重试，或用 ./gradlew check -PskipJsHarness 跳过；' +
                ' 若为用例失败请查看上方输出。原始错误：' + detail
            )
        }
    }
}

tasks.named('check') {
    dependsOn 'jsHarness'
}
