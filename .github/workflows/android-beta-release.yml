name: Android Beta Release

on:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"

permissions:
  contents: write

concurrency:
  group: android-beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version-change:
    name: Detect Version Change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect app version change
        id: version
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -z "${before}" || "${before}" == "0000000000000000000000000000000000000000" ]]; then
            before="${after}^"
          fi

          # 与 app/build.gradle.kts 的 versionCodeOf 保持同一映射（CI 侧用于前置校验；
          # 构建后另有 “Verify APK versionCode” 步骤核对，兜底两处公式漂移）：
          # major*1_000_000 + minor*1_000 + patch
          code_of() {
            local cleaned major=0 minor=0 patch=0 _
            cleaned="$(printf '%s' "$1" | sed -E 's/^[^0-9]*//; s/[^0-9.].*$//')"
            IFS=. read -r major minor patch _ <<< "${cleaned}"
            echo $(( ${major:-0} * 1000000 + ${minor:-0} * 1000 + ${patch:-0} ))
          }

          # 兼容旧格式：优先 val appVersionName，其次 versionName = "x"
          extract_name() {
            local content="$1" name=""
            if [[ -n "${content}" ]]; then
              name="$(printf '%s\n' "${content}" | grep -E '^[[:space:]]*val appVersionName[[:space:]]*=' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
              if [[ -z "${name}" ]]; then
                name="$(printf '%s\n' "${content}" | grep -E '^[[:space:]]*versionName[[:space:]]*=' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
              fi
            fi
            printf '%s' "${name}"
          }

          old_file="$(git show "${before}:app/build.gradle.kts" 2>/dev/null || true)"
          new_file="$(cat app/build.gradle.kts)"
          old_name="$(extract_name "${old_file}")"
          new_name="$(extract_name "${new_file}")"

          if [[ -z "${new_name}" ]]; then
            echo "::error::无法从 app/build.gradle.kts 解析版本号（缺少 val appVersionName）"
            exit 1
          fi

          if [[ -z "${old_name}" ]]; then
            # 首次提交 / force-push 读取不到旧版本：无法程序化校验，仅提示
            echo "::warning::无法读取旧版本号（首次提交或 force-push），跳过 versionCode 递增校验"
          elif [[ "${old_name}" == "${new_name}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          else
            old_code="$(code_of "${old_name}")"
            new_code="$(code_of "${new_name}")"
            if (( new_code <= old_code )); then
              echo "::error::versionCode 必须严格递增：${old_name}(${old_code}) -> ${new_name}(${new_code})"
              echo "::error::请提升 app/build.gradle.kts 的 appVersionName（versionCode 会自动推导）"
              exit 1
            fi
            echo "versionName ${old_name} -> ${new_name}, versionCode ${old_code} -> ${new_code}"
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "version_name=${new_name}" >> "${GITHUB_OUTPUT}"
          echo "version_code=$(code_of "${new_name}")" >> "${GITHUB_OUTPUT}"

  release-beta:
    name: Release Beta APK
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HIKARINAGI_CLIENT_ID: ${{ vars.HIKARINAGI_CLIENT_ID }}

    steps:
      - name: Validate release configuration
        run: |
          if [[ -z "${HIKARINAGI_CLIENT_ID}" ]]; then
            echo "::error::Missing GitHub repository variable: HIKARINAGI_CLIENT_ID"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

          keystore="${RUNNER_TEMP}/tyranor-next-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          {
            echo "ANDROID_KEYSTORE_FILE=${keystore}"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK versionCode
        run: |
          expected="${{ needs.detect-version-change.outputs.version_code }}"
          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [[ -z "${apk}" ]]; then
            echo "::error::No release APK found." >&2
            exit 1
          fi
          aapt2="${ANDROID_HOME}/build-tools/37.0.0/aapt2"
          actual="$("${aapt2}" dump badging "${apk}" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -n 1)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::APK versionCode=${actual} 与 CI 期望=${expected} 不一致（Gradle 推导与 CI 映射漂移）"
            exit 1
          fi
          echo "APK versionCode=${actual} verified (versionName=${{ needs.detect-version-change.outputs.version_name }})."

      - name: Prepare release metadata
        id: meta
        run: |
          version="${{ needs.detect-version-change.outputs.version_name }}"
          version_code="${{ needs.detect-version-change.outputs.version_code }}"
          tag="beta-${version}"

          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [[ -z "${apk}" ]]; then
            echo "No release APK found." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "apk=${apk}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APK_PATH: ${{ steps.meta.outputs.apk }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${APK_PATH}" --clobber
          else
            gh release create "${TAG_NAME}" "${APK_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "Tyranor Next ${VERSION_NAME}" \
              --notes "Automated beta build from versionCode ${VERSION_CODE}, commit ${GITHUB_SHA}." \
              --prerelease
          fi
