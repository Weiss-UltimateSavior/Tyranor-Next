name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HIKARINAGI_CLIENT_ID: ${{ vars.HIKARINAGI_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 必须显式覆盖 action 默认的 packages（`tools platform-tools`）：`tools` 已从
          # Google SDK 仓库下架，安装会以 "Failed to find package 'tools'" 退出 1。
          # 需要的 platforms / build-tools 由下一步按 canary 通道安装。
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
