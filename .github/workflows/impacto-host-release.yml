name: Impacto host release

# Builds the unmodified upstream Impacto library from the pinned source, packages it into the standalone host APK,
# signs it with the Tyranor release key and publishes it as a pre-release. Tyranor Next links to this release
# (ImpactoExternalEngineModule.installUrl), so it must exist before a change that raises the expected host version
# is merged. Run it by hand: it takes a long time (vcpkg builds SDL3, FFmpeg and more).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Read the host version
        id: meta
        run: |
          VERSION=$(sed -n 's/.*versionName = if (hostOnly) "[^"]*" else "\([^"]*\)".*/\1/p' engine/impacto/host-apk/app/build.gradle.kts)
          [[ -n "${VERSION}" ]] || { echo "::error::cannot read the host versionName"; exit 1; }
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=impacto-host-${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists. Raise the host versionName/versionCode instead of replacing a published APK."
            exit 1
          fi

      - name: Check the app/host contract and tool tests
        run: |
          python3 tools/impacto/check-host-contract.py
          python3 tools/impacto/test-upstream-integrity.py
          python3 tools/impacto/test-build-preflight.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config autoconf automake libtool libtool-bin m4 nasm bison flex unzip zip

      - name: Install the pinned NDK and CMake
        run: |
          eval "$(bash tools/impacto/setup-linux-tools.sh)"
          {
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
            echo "IMPACTO_CMAKE=${IMPACTO_CMAKE}"
          } >> "${GITHUB_ENV}"

      - name: Build the unmodified upstream library
        env:
          IMPACTO_UPSTREAM_BUILD_ROOT: ${{ runner.temp }}/impacto-build
          VCPKG_MAX_CONCURRENCY: '4'
        run: bash tools/impacto/build-upstream.sh

      - name: Decode the Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          [[ "${missing}" -eq 0 ]] || exit 1
          keystore="${RUNNER_TEMP}/tyranor-next-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          {
            echo "ANDROID_KEYSTORE_FILE=${keystore}"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Package and sign the host APK
        env:
          BUILD_ROOT: ${{ runner.temp }}/impacto-build
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;37.0.0" >/dev/null
          ./gradlew -p engine/impacto/host-apk :app:testReleaseUnitTest :app:assembleRelease --no-daemon \
            "-PimpactoSource=${BUILD_ROOT}/source" "-PimpactoCandidate=${BUILD_ROOT}/candidate"

      - name: Verify the APK contents
        env:
          BUILD_ROOT: ${{ runner.temp }}/impacto-build
        run: |
          apk=$(ls engine/impacto/host-apk/app/build/outputs/apk/release/*.apk)
          [[ $(echo "${apk}" | wc -l) == 1 ]] || { echo "::error::expected exactly one release APK"; exit 1; }
          build_tools=$(ls -d "${ANDROID_HOME}"/build-tools/37.0.0)
          "${build_tools}/apksigner" verify --verbose --print-certs "${apk}" | tee "${RUNNER_TEMP}/apksigner.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true\|Verified using v3 scheme (APK Signature Scheme v3): true' "${RUNNER_TEMP}/apksigner.txt"
          if grep -qi 'Android Debug' "${RUNNER_TEMP}/apksigner.txt"; then
            echo "::error::The APK is signed with a debug key"
            exit 1
          fi
          python3 - "${apk}" "${BUILD_ROOT}/candidate/candidate.json" <<'PY'
          import hashlib, json, sys, zipfile
          apk, report = sys.argv[1], json.load(open(sys.argv[2], encoding='utf-8'))
          z = zipfile.ZipFile(apk)
          lib = hashlib.sha256(z.read('lib/arm64-v8a/libimpacto.so')).hexdigest()
          if lib != report['sha256']:
              raise SystemExit('libimpacto.so in the APK is not the candidate library')
          names = z.namelist()
          for needed in ('assets/gamedefinitions.lua', 'assets/profiles/mo6tw/game.lua', 'classes.dex'):
              if needed not in names:
                  raise SystemExit('missing ' + needed)
          print('APK contains the candidate library', lib)
          PY

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_ROOT: ${{ runner.temp }}/impacto-build
        run: |
          apk=$(ls engine/impacto/host-apk/app/build/outputs/apk/release/*.apk)
          mkdir -p release-assets
          cp "${apk}" "release-assets/impacto-host-${VERSION}.apk"
          cp "${BUILD_ROOT}/candidate/candidate.json" "release-assets/impacto-host-${VERSION}.candidate.json"
          (cd release-assets && sha256sum "impacto-host-${VERSION}.apk" > "impacto-host-${VERSION}.apk.sha256")
          upstream=$(python3 -c "import json;print(json.load(open('engine/impacto/source-lock.json'))['impacto']['revision'])")
          gh release create "${TAG}" release-assets/* \
            --target "${GITHUB_SHA}" \
            --title "Impacto host ${VERSION}" \
            --notes "Standalone host for the unmodified upstream CommitteeOfZero/impacto at ${upstream}, built from commit ${GITHUB_SHA}. Install it, then start an Impacto game from Tyranor Next. candidate.json records the library SHA-256 and the pinned source lock." \
            --prerelease
