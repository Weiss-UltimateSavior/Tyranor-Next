// RPG Maker MV/MZ 独立运行时（v1/v2）。
//
// 与 tyrano 运行时（engine 模块 com.core.tyrano 包，承载 v0）完全分离：
// 宿主代码由 v0 宿主复制而来并叠加版本门控的 v1/v2 兼容层，运行在独立的
// :rpgmaker 进程；运行时资产（NW.js polyfill、rpgmv-v1 核心覆盖、
// rpgmv-v2-joi shims、__rpg_v12.js hook）随本模块打包。
// 本模块不依赖 :engine（EnginePrefs/EngineThemeColors/DoubleBackExit 为
// engine 同源镜像复制件），由 :engine 以 api 方式挂在自身之下，app 仅依赖
// :engine 即可传递获得本模块（三层架构：app -> engine -> rpgmaker）。
//
// 【共享资产契约】本模块运行期按文件名读取以下 engine 模块资产（经库模块
// assets 平铺合并进 APK，单份源头在 engine，禁止两处手工维护）：
//   __rpg__.js / __rmmz__.js / __hook_rmmz_core.js / __hook_rmmz_managers.js
//   __touch_pad.js / __tyranor_mouse.js / __rpgmaker_mod_core.js / __rpgmaker_mod_ui.js
//   __rpgmaker_mod.css / __rpgmaker_mod_icon.png
// engine 侧修改这些文件需同时回归 v0 与 v1/v2 两条运行时路径。
// engine/assets 中不存在同名文件，故无合并冲突；本模块资产均为 v1/v2 专属。
//
// 【复制件基线】AsarArchive / VirtualMouseLayer / RpgMakerStorage / DoubleBackExit /
// EngineThemeColors / EnginePrefs(镜像) 为 engine 模块 com.core.engine、com.core.tyrano
// 同名文件的复制件（分叉基线：d97dc0a）。同步检查命令：
//   git diff --no-index engine/src/main/java/com/core/tyrano/AsarArchive.kt rpgmaker/src/main/java/com/core/rpgmaker/AsarArchive.kt
//   git diff --no-index engine/src/main/java/com/core/tyrano/VirtualMouseLayer.kt rpgmaker/src/main/java/com/core/rpgmaker/VirtualMouseLayer.kt
//   git diff --no-index engine/src/main/java/com/core/tyrano/TyranoStorage.kt rpgmaker/src/main/java/com/core/rpgmaker/RpgMakerStorage.kt
//   git diff --no-index engine/src/main/java/com/core/engine/DoubleBackExit.java rpgmaker/src/main/java/com/core/rpgmaker/DoubleBackExit.java
//   git diff --no-index engine/src/main/java/com/core/engine/EngineThemeColors.kt rpgmaker/src/main/java/com/core/rpgmaker/EngineThemeColors.kt
// v0 侧修复这些文件时须双处同步。
plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.core.rpgmaker'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.kotlin.stdlib
    testImplementation libs.junit
}
